name: Update VPN subscriptions

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main, master]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/update-subscriptions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python scripts/collect.py

      - name: Commit updated subscriptions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update VPN subscriptions"
          file_pattern: output/*
          branch: ${{ github.ref_name }}
