# Public subscription sources (open mirrors only). See README.md.

settings:
  output_dir: output
  request_timeout_sec: 30
  user_agent: "vpn-sub-collector/1.0 (+https://github.com/MaksRotEbal/vpn-subscription-collector)"
  connect_timeout_sec: 4
  health_workers: 50
  max_wl: 100
  max_bl: 100
  max_all: 200
  max_health_checks: 1500

sources:
  - name: ebrasha-v2ray-lite
    url: "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/V2Ray-Config-By-EbraSha.txt"
    enabled: true

  - name: ebrasha-vless
    url: "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vless_configs.txt"
    enabled: true

  - name: ebrasha-vmess
    url: "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/vmess_configs.txt"
    enabled: true

  - name: ebrasha-trojan
    url: "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/trojan_configs.txt"
    enabled: true

  - name: openproxylist-v2ray-raw
    url: "https://raw.githubusercontent.com/roosterkid/openproxylist/main/V2RAY_RAW.txt"
    enabled: true

  - name: openproxylist-v2ray
    url: "https://raw.githubusercontent.com/roosterkid/openproxylist/main/V2RAY.txt"
